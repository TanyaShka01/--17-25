[metadata]
name = depvis
version = 1.0.0
description = Визуализация графа зависимостей пакета
license = MIT

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    depvis = depvis.cli:main

[pycodestyle]
max-line-length = 79
exclude = .git,__pycache__,ep5_output,build,dist

[flake8]
max-line-length = 79
exclude = .git,__pycache__,ep5_output,build,dist

[tool:pytest]
testpaths = tests
pythonpath = src
